<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="rcpTitle">
  <title id="rcpTitle">RestoreClaimPro logo</title>
  <!-- Brand mark: a rounded "claim seal" with a droplet rebuilt into a rising strata line -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#0E3B2E"/>
  <!-- subtle ring -->
  <rect x="6" y="6" width="52" height="52" rx="13.5" fill="none" stroke="#1F5C45" stroke-width="1.6"/>
  <!-- water droplet -->
  <path d="M32 11c1.9 6.4 10.6 11.9 10.6 20.6A10.6 10.6 0 0 1 32 42.2a10.6 10.6 0 0 1-10.6-10.6C21.4 22.9 30.1 17.4 32 11Z" fill="#7FB69B"/>
  <!-- rising strata / rebuild line -->
  <path d="M21 48h4.6l2.6-6.4 3.4 8.8 3.4-12.4 3.2 10h8" fill="none" stroke="#E9A23B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- amber check on the droplet -->
  <path d="M27.4 31.2l3.2 3.4 6.6-7.4" fill="none" stroke="#0E3B2E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
